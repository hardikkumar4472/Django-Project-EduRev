<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 160" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F37021"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081628"/>
      <stop offset="60%" stop-color="#0B1E36"/>
      <stop offset="100%" stop-color="#0F2746"/>
    </linearGradient>
  </defs>

  <!-- Orange wave base spanning the right and middle -->
  <path d="M 500,20 C 780,5 1150,15 1440,22 L 1440,160 L 500,160 Z" fill="url(#orangeGrad)"/>

  <!-- Navy wave sweeping smoothly across the left and transitioning gracefully into orange with generous width -->
  <path d="M 0,28 C 280,56 560,8 940,26 C 970,55 955,92 920,122 C 890,146 870,155 850,160 L 0,160 Z" fill="url(#navyGrad)"/>
</svg>
