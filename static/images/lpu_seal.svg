<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <path id="circleTextTop" d="M 20,80 A 60,60 0 1,1 140,80" fill="none"/>
    <path id="circleTextBottom" d="M 140,80 A 60,60 0 0,1 20,80" fill="none"/>
  </defs>

  <!-- Outer Double Rings in LPU Orange -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#F37021" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="69" fill="none" stroke="#F37021" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="80" cy="80" r="48" fill="none" stroke="#F37021" stroke-width="1.5"/>

  <!-- Circular Text -->
  <text font-family="'Inter', -apple-system, sans-serif" font-size="8.8" font-weight="800" fill="#F37021" letter-spacing="1.5px">
    <textPath href="#circleTextTop" startOffset="50%" text-anchor="middle">
      LOVELY PROFESSIONAL UNIVERSITY
    </textPath>
  </text>

  <text font-family="'Inter', -apple-system, sans-serif" font-size="8.2" font-weight="700" fill="#EA580C" letter-spacing="2px">
    <textPath href="#circleTextBottom" startOffset="50%" text-anchor="middle">
      ★ HOSTEL ADMINISTRATION ★
    </textPath>
  </text>

  <!-- Center LPU Stylized Sunburst / Star Emblem -->
  <g transform="translate(56, 56) scale(0.85)">
    <!-- Top facets -->
    <polygon points="28,4 17,20 28,22" fill="#FDBA74"/>
    <polygon points="28,4 28,22 39,20" fill="#FB923C"/>
    <!-- Side facets -->
    <polygon points="17,20 4,28 19,30" fill="#F97316"/>
    <polygon points="39,20 52,28 37,30" fill="#EA580C"/>
    <!-- Center diamond facets -->
    <polygon points="28,22 19,30 28,40" fill="#EA580C"/>
    <polygon points="28,22 28,40 37,30" fill="#C2410C"/>
    <!-- Lower side facets -->
    <polygon points="4,28 15,42 19,30" fill="#C2410C"/>
    <polygon points="52,28 41,42 37,30" fill="#9A3412"/>
    <!-- Bottom facets -->
    <polygon points="19,30 15,42 28,40" fill="#7C2D12"/>
    <polygon points="37,30 41,42 28,40" fill="#7C2D12"/>
    <polygon points="15,42 28,52 28,40" fill="#431407"/>
    <polygon points="41,42 28,52 28,40" fill="#431407"/>
    <circle cx="28" cy="30" r="3" fill="#FFF7ED"/>
  </g>
</svg>

