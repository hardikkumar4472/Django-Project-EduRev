<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <!-- Soft background element -->
  <path d="M40,160 Q80,100 160,110 T260,80 Q290,130 250,190 T90,210 Z" fill="#EEF2F6" opacity="0.8"/>
  <circle cx="210" cy="60" r="28" fill="#FEF3C7" opacity="0.6"/>
  <!-- Campus building distant silhouette -->
  <rect x="180" y="100" width="18" height="40" fill="#CBD5E1" rx="2"/>
  <polygon points="189,88 178,100 200,100" fill="#94A3B8"/>
  <rect x="202" y="112" width="22" height="28" fill="#CBD5E1" rx="2"/>
  <rect x="228" y="106" width="16" height="34" fill="#CBD5E1" rx="2"/>
  <!-- Path / Ground -->
  <path d="M20,205 C100,205 180,195 280,205" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <!-- Paper airplane flying -->
  <g transform="translate(230, 45) rotate(-15)">
    <polygon points="0,0 24,10 0,20 6,10" fill="#0F2942"/>
    <polygon points="0,0 24,10 6,10" fill="#1E3A8A"/>
    <!-- Flight dash trail -->
    <path d="M-5,10 Q-25,12 -35,28" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  </g>
  <!-- Student walking with backpack -->
  <!-- Legs -->
  <path d="M125,150 L115,198 L105,202" stroke="#0F2942" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130,150 L142,185 L155,198" stroke="#0F2942" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <ellipse cx="103" cy="202" rx="7" ry="3.5" fill="#1E293B"/>
  <ellipse cx="157" cy="198" rx="7" ry="3.5" fill="#1E293B"/>
  <!-- Torso & Jacket -->
  <path d="M118,108 C115,125 116,145 118,154 C124,156 138,155 140,152 C142,142 142,122 138,108 Z" fill="#0D9488"/>
  <path d="M120,110 L136,110 L134,136 L122,136 Z" fill="#FFFFFF"/>
  <!-- Backpack -->
  <path d="M106,112 C104,118 102,136 106,144 C110,147 116,146 118,143 L118,114 C115,110 110,109 106,112 Z" fill="#3B82F6"/>
  <path d="M114,115 L120,136" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms & Hands -->
  <path d="M117,114 L108,138 L114,146" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136,114 L146,132 L142,144" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head & Hair -->
  <circle cx="132" cy="94" r="10" fill="#FBBF24"/>
  <path d="M124,90 C124,82 138,80 142,88 C136,87 132,88 128,91 Z" fill="#0F172A"/>
  <ellipse cx="136" cy="94" rx="1.5" ry="1.5" fill="#0F172A"/>
  <!-- Handwritten script "Find your place" -->
  <text x="180" y="160" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="20" fill="#0F2942" font-weight="bold" transform="rotate(-6 180 160)">Find your place</text>
  <path d="M185,166 Q220,172 245,160" stroke="#0D9488" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
